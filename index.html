<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006838">
<title>Legajo · Pinos Grandis</title>
<link rel="icon" href="/marca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <img class="login-logo" src="/lockup.png" alt="Pinos Grandis">
    <div class="acento" style="margin-bottom:20px"></div>
    <div class="field">
      <label for="u">Usuario</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="p">Contraseña</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-primary btn-block" type="submit" id="btnEntrar">Entrar</button>
  </form>
</div>

<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="brand" style="margin:0">
        <span class="mark"><img src="/marca.png" alt=""></span>
        <div>
          <div class="brand-name">Pinos Grandis</div>
          <div class="brand-sub">Legajo</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-label">Gestión</div>
        <a data-view="personal" class="on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
          <b>Personal</b><span class="count" id="cPersonal"></span>
        </a>
        <a data-view="vencimientos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <b>Vencimientos</b><span class="count" id="cVenc"></span>
        </a>
        <a data-view="epp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.4 3.4 8.3 8 9 4.6-.7 8-4.6 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
          <b><span class="largo">Entregas de </span>EPP</b><span class="count" id="cEpp"></span>
        </a>
        <a data-view="drive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          <b>Drive</b>
        </a>
      </nav>
      <div class="side-foot">
        <div class="userchip">
          <span class="avatar" id="userIni">··</span>
          <div style="line-height:1.3">
            <div style="font-size:12.5px;font-weight:600;color:var(--ink)" id="userNom">—</div>
            <div style="font-size:11px" id="userRol">Sesión iniciada</div>
          </div>
        </div>
        <button class="btn btn-sm" id="logout">Cerrar sesión</button>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="cargando"><span class="spin"></span> Leyendo la planilla…</div>
    </main>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<div class="guardando" id="guardando"><span class="spin"></span> Guardando en Drive…</div>

<script src="/legajo.js"></script>
</body>
</html>
